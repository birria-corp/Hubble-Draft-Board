<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="#07101f"/>
  <!-- Stars -->
  <circle cx="30" cy="25" r="1.5" fill="#f5f9ff" opacity="0.8"/>
  <circle cx="160" cy="18" r="1" fill="#f5f9ff" opacity="0.6"/>
  <circle cx="170" cy="50" r="1.5" fill="#f5f9ff" opacity="0.9"/>
  <circle cx="22" cy="80" r="1" fill="#f5f9ff" opacity="0.7"/>
  <circle cx="145" cy="165" r="1.5" fill="#f5f9ff" opacity="0.8"/>
  <circle cx="55" cy="170" r="1" fill="#f5f9ff" opacity="0.6"/>
  <circle cx="175" cy="140" r="1" fill="#f5f9ff" opacity="0.7"/>
  <!-- Telescope tube (angled) -->
  <g transform="translate(96,96) rotate(-35)">
    <!-- Main tube -->
    <rect x="-8" y="-52" width="16" height="72" rx="4" fill="#4f8cff"/>
    <!-- Tube highlight -->
    <rect x="-5" y="-50" width="5" height="68" rx="2" fill="#7fb3ff" opacity="0.4"/>
    <!-- Eyepiece end (top) -->
    <rect x="-10" y="-58" width="20" height="12" rx="3" fill="#263b58"/>
    <rect x="-7" y="-56" width="14" height="8" rx="2" fill="#4f8cff" opacity="0.7"/>
    <!-- Objective lens end (bottom) -->
    <rect x="-12" y="20" width="24" height="10" rx="3" fill="#263b58"/>
    <ellipse cx="0" cy="25" rx="9" ry="4" fill="#4f8cff" opacity="0.5"/>
    <!-- Lens cap / glass gleam -->
    <ellipse cx="0" cy="25" rx="6" ry="2.5" fill="#96c8ff" opacity="0.3"/>
    <!-- Mount ring -->
    <rect x="-14" y="-10" width="28" height="8" rx="3" fill="#263b58"/>
    <rect x="-12" y="-8" width="24" height="4" rx="2" fill="#4f8cff" opacity="0.4"/>
  </g>
  <!-- Tripod legs -->
  <line x1="96" y1="108" x2="68" y2="160" stroke="#263b58" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="108" x2="96" y2="165" stroke="#263b58" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="108" x2="124" y2="160" stroke="#263b58" stroke-width="5" stroke-linecap="round"/>
  <!-- Tripod feet -->
  <rect x="60" y="158" width="16" height="5" rx="2.5" fill="#4f8cff" opacity="0.7"/>
  <rect x="88" y="163" width="16" height="5" rx="2.5" fill="#4f8cff" opacity="0.7"/>
  <rect x="116" y="158" width="16" height="5" rx="2.5" fill="#4f8cff" opacity="0.7"/>
  <!-- Gold star / target object being observed -->
  <circle cx="148" cy="38" r="8" fill="none" stroke="#f4b83f" stroke-width="1.5" opacity="0.8"/>
  <circle cx="148" cy="38" r="3" fill="#f4b83f" opacity="0.9"/>
  <line x1="148" y1="26" x2="148" y2="22" stroke="#f4b83f" stroke-width="1.5" opacity="0.7"/>
  <line x1="148" y1="50" x2="148" y2="54" stroke="#f4b83f" stroke-width="1.5" opacity="0.7"/>
  <line x1="136" y1="38" x2="132" y2="38" stroke="#f4b83f" stroke-width="1.5" opacity="0.7"/>
  <line x1="160" y1="38" x2="164" y2="38" stroke="#f4b83f" stroke-width="1.5" opacity="0.7"/>
</svg>
