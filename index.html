const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();
const LS='HDB_state';
async function runSync(uid){
  try{
    const ref=doc(db,'users',uid,'data','HDB_state');
    const snap=await getDoc(ref);
    const local=localStorage.getItem(LS);
    if(snap.exists()){
      const cloud=snap.data().payload;
      if(cloud&&cloud!==local){
        if(!local||confirm('Cloud data differs from local. Use cloud data?')){
          localStorage.setItem(LS,cloud);
          window._reloadAppState&&window._reloadAppState();
        }else{await setDoc(ref,{payload:local});}
      }
    }else if(local){await setDoc(ref,{payload:local});}
  }catch(e){console.error('Sync error',e);}
}
window._signIn=()=>signInWithPopup(auth,provider).catch(e=>alert('Sign-in failed: '+e.message));
window._signOut=()=>signOut(auth);
window._syncNow=async()=>{
  if(!window._authUser){alert('Not signed in.');return;}
  window._showToast&&window._showToast('Syncing...');
  await runSync(window._authUser.uid);
};
onAuthStateChanged(auth,async user=>{
  window._authUser=user||null;
  window.dispatchEvent(new CustomEvent('authChanged',{detail:user}));
  if(user)await runSync(user.uid);
});
</script>

const idd=p=>encodeURIComponent(p.name);
const getp=n=>state.find(p=>p.name===decodeURIComponent(n));
const group=p=>['WR','TE'].includes(p.pos)?'WR-TE':p.pos;
const isPos=(p,x)=>x==='ALL'||group(p)===x;
const available=()=>state.filter(p=>p.status==='Available');
const picks=()=>state.filter(p=>p.status==='Picked').sort((a,b)=>(a.pickOrder||0)-(b.pickOrder||0));
const kt=()=>picks().filter(p=>p.keeper==='Yes').reduce((s,p)=>s+Number(p.salary||0),0);
const ds=()=>picks().filter(p=>p.keeper!=='Yes').reduce((s,p)=>s+Number(p.salary||0),0);
const db=()=>settings.totalBudget-settings.trades-kt();
const money=n=>'$'+Number(n||0).toLocaleString();
function save(){localStorage.setItem(LS_STATE,JSON.stringify({players:state,settings,history}));}
function snapshot(){history.push(JSON.stringify({players:state,settings}));if(history.length>50)history.shift();save();}
function act(kind,n){snapshot();const p=getp(n);if(kind==='take'){p.status='Taken';p.salary=null;}if(kind==='pick'){p.status='Picked';p.salary=p.salary??'';p.pickOrder=Date.now();}if(kind==='remove'){p.status='Available';p.salary=null;}save();draw();}
function undo(){if(!history.length)return;const old=JSON.parse(history.pop());state=old.players;settings=old.settings;save();draw();}
const limits={QB:1,RB:1,'WR-TE':4,K:1,DST:1};
function assignments(){let rem={...limits},s={QB:[],RB:[],'WR-TE':[],K:[],DST:[]},r=[];for(const p of picks()){const g=group(p);if(rem[g]>0){s[g].push(p);rem[g]--;}else r.push(p);}return{s,r};}

  return 'Build a comprehensive '+settings.season+' NFL player board for Hubble Draft Board. Research current expert consensus rankings, neutral-PPR $200 auction values, final depth charts, and injury/news updates. Rank by this exact scoring, not generic PPR.\n\nBUDGET: Season '+settings.season+'; Total Budget $'+settings.totalBudget+'; Trades $'+settings.trades+' (positive sent, negative received); Keeper Salaries $'+kt()+'; Draft Budget $'+db()+'; Keepers: '+k+'.\n\nSCORING:\n'+sc+'\n\nVALUE: base = neutral-PPR whole-dollar market auction value. max = scoring-aware whole-dollar maximum for my current draft budget. Do not overpay QB, K, or DST in one-starter format.\n\nCOMPLETENESS: Include 150+ meaningful QB/RB/WR/TE candidates plus rookies, handcuffs, and draftable upside depth. Include exactly 32 DSTs (one per NFL team) and exactly 32 current starting kickers (one per NFL team); state K uncertainty in notes but never omit a team. Include my keepers with notes exactly Keeper--already rostered; do not nominate.\n\nSLEEPERS: Identify consensus sleepers from credible current sources where they exist: ideally 1-2 QB, 5-10 combined WR/TE, and 5-10 RB. Set sleeper:true only for those consensus sleeper picks; omit or set false for all others.\n\nOUTPUT: Return JSON only, exactly {"season":'+settings.season+',"players":[{"rank":1,"name":"Player Name","pos":"QB","team":"ABC","base":42,"max":48,"sleeper":false,"notes":"Brief note"}]}. pos is QB/RB/WR/TE/K/DST; team three-letter abbreviation; rank/base/max integers; max >= base. Ranks consecutive unique from 1; unique player names; 32 unique K teams; 32 unique DST teams. Silently validate before returning.';
}
function buttons(p){return '<div class="rowbuttons"><button class="taken" data-action="take" data-name="'+idd(p)+'">Taken</button><button class="picked" data-action="pick" data-name="'+idd(p)+'">Picked</button></div>';}
function picker(){return '<div class="toolbar">'+filters.map(x=>'<button class="filter '+(filter===x?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'<button class="filter tool-link" data-action="viewBest">Best Available</button><button class="filter tool-link" data-action="viewSleepers">Sleepers</button><button class="filter tool-link" data-action="viewRoster">My Roster</button></div>';}
function flatSleepers(){const v=available().filter(p=>p.sleeper).sort((a,b)=>b.max-a.max);return '<div class="panel"><h2>Available Consensus Sleepers</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Team</th><th class="money">Max $</th><th>Action</th></tr></thead><tbody>'+v.map(p=>'<tr><td class="rank">'+p.rank+'</td><td><b>'+esc(p.name)+'</b><span class="zzz">ZZZ</span></td><td class="pos">'+group(p)+'</td><td>'+esc(p.team)+'</td><td class="money">'+money(p.max)+'</td><td>'+buttons(p)+'</td></tr>').join('')+'</tbody></table></div></div>';}
function boardH(){
  if(viewMode==='sleepers')return picker()+flatSleepers();
  if(viewMode==='best')return picker()+best();
  if(viewMode==='roster')return picker()+roster();
  const v=available().filter(p=>isPos(p,filter)).sort((a,b)=>typeof a[sort]==='string'?a[sort].localeCompare(b[sort])*dir:(Number(a[sort])-Number(b[sort]))*dir);
  return '<div class="toolbar">'+filters.map(x=>'<button class="filter '+(filter===x?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'<button class="filter tool-link" data-action="viewBest">Best Available</button><button class="filter tool-link" data-action="viewSleepers">Sleepers</button><button class="filter tool-link" data-action="viewRoster">My Roster</button></div><div class="panel"><h2>All Players - Suggested Max $</h2><div class="tablewrap"><table><thead><tr><th class="sort" data-sort="rank">#</th><th class="sort" data-sort="name">Player</th><th>Pos</th><th>Team</th><th class="money sort" data-sort="max">Max $</th><th>Notes</th><th class="sleeper-cell">ZZZ</th><th>Action</th></tr></thead><tbody>'+v.map(p=>'<tr><td class="rank">'+p.rank+'</td><td><b>'+esc(p.name)+'</b>'+(p.sleeper?'<span class="zzz">ZZZ</span>':'')+(p.keeper==='Yes'?'<div class="keeper">KEEPER</div>':'')+'</td><td class="pos">'+group(p)+'</td><td>'+esc(p.team)+'</td><td class="money">'+money(p.max)+'</td><td class="player-notes">'+esc(p.notes||'')+'</td><td class="sleeper-cell">'+(p.sleeper?'<span class="zzz">ZZZ</span>':'&mdash;')+'</td><td>'+buttons(p)+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function best(){return '<div class="best-grid">'+filters.slice(1).map(g=>'<div class="panel best-card"><h3>'+g+'</h3>'+available().filter(p=>isPos(p,g)).sort((a,b)=>b.max-a.max).slice(0,3).map(p=>'<div class="best-row"><b>'+esc(p.name)+'</b>'+(p.sleeper?'<span class="zzz">ZZZ</span>':'')+'<small>'+esc(p.team)+' &middot; '+money(p.max)+'</small>'+buttons(p)+'</div>').join('')+'</div>').join('')+'</div>';}
function roster(){
  const a=assignments();
  const slot=(p,l)=>'<div class="slot">'+(p?'<div><b>'+esc(p.name)+'</b><small>'+group(p)+' &middot; '+esc(p.team)+(p.keeper==='Yes'?' &middot; Keeper':'')+'</small><button class="undo-mini" data-action="remove" data-name="'+idd(p)+'">Remove</button></div><input data-salary="'+idd(p)+'" type="number" value="'+(p.salary??'')+'">':'<div class="empty">'+l+'</div>')+'</div>';
  const starts=Object.entries(limits).map(([g,n])=>'<div class="group"><h3>'+g+' starter'+(n>1?'s':'')+'</h3>'+Array.from({length:n},(_,i)=>slot(a.s[g][i],g+' starter slot')).join('')+'</div>').join('');
  return '<div class="layout"><div class="panel"><h2>Starting Lineup</h2><div class="inside">'+starts+'</div></div><div class="panel"><h2>Reserves (6)</h2><div class="inside">'+Array.from({length:6},(_,i)=>slot(a.r[i],'Reserve slot')).join('')+'</div></div></div>';
}
function settingsH(){
  const k=picks().filter(p=>p.keeper==='Yes');
  const sc=scoreDefaults.map(x=>'<div class="setting-grid"><label>'+esc(x[1])+'</label><input data-score="'+x[0]+'" value="'+esc(settings.scoring[x[0]])+'"></div>').join('');
  return '<div class="settings"><div class="panel"><h2>League Settings</h2><div class="inside">'+
    '<div class="setting-grid"><label>Season year</label><input type="number" data-setting="season" value="'+settings.season+'"></div>'+
    '<div class="setting-grid"><label>Total Budget</label><input type="number" data-setting="totalBudget" value="'+settings.totalBudget+'"></div>'+
    '<div class="setting-grid"><label>Trades (sent positive, received negative)</label><input type="number" data-setting="trades" value="'+settings.trades+'"></div>'+
    '<div class="setting-grid"><label>Keeper Salaries</label><input disabled value="'+money(kt())+'"></div>'+
    '<div class="setting-grid"><label>Draft Budget</label><input disabled value="'+money(db())+'"></div>'+
    '<div class="section-label">Keepers</div>'+
    k.map(p=>'<div class="keeper-row"><input data-kfield="name" data-name="'+idd(p)+'" value="'+esc(p.name)+'"><input data-kfield="pos" data-name="'+idd(p)+'" value="'+esc(p.pos)+'"><input data-kfield="team" data-name="'+idd(p)+'" value="'+esc(p.team)+'"><input type="number" data-salary="'+idd(p)+'" value="'+p.salary+'"><button class="taken" data-action="removeK" data-name="'+idd(p)+'">X</button></div>').join('')+
    '<p><button class="action" data-action="addK">+ Add Keeper</button></p>'+
    '<div class="section-label">Import Players</div>'+
    '<textarea id="json" style="min-height:160px" placeholder="Paste player JSON to import"></textarea>'+
    '<p><button class="action" data-action="importJ">Import Players</button> <button class="action" data-action="chooseJ">Choose JSON File</button> <button class="action reset" data-action="resetH">Reset Draft</button></p>'+
    '<div class="section-label">Prompt Tools</div>'+
    '<p><button class="action export" data-action="exportH">Export Prompt</button> <button class="action" data-action="copyH">Copy Prompt</button></p>'+
    '<textarea id="promptbox" style="min-height:130px" placeholder="Generated prompt appears here"></textarea>'+
    '</div></div><div class="panel"><h2>Scoring Parameters</h2><div class="inside">'+sc+'</div></div></div>';
}
function normalize(x){
  const a=Array.isArray(x)?x:x.players;
  if(!Array.isArray(a)||!a.length)throw Error('JSON needs a non-empty players array.');
  return a.map((p,i)=>{
    const pos=String(p.pos||p.position||'').toUpperCase();
    if(!['QB','RB','WR','TE','K','DST'].includes(pos)||!p.name||!p.team)throw Error('Each player needs valid name, team, and position.');
    return{rank:Number(p.rank)||i+1,name:String(p.name),pos,team:String(p.team),base:Number(p.base??0),max:Number(p.max??p.base??0),status:'Available',salary:null,keeper:'No',notes:String(p.notes||''),sleeper:Boolean(p.sleeper||p.isSleeper),pickOrder:0};
  });
}
function importList(text){
  try{
    const x=JSON.parse(text);
    if(Number.isInteger(Number(x.season)))settings.season=Number(x.season);
    snapshot();state=normalize(x);history=[];save();tab='board';draw();
    window._showToast('Imported '+state.length+' players.');
  }catch(e){alert('Import failed: '+e.message);}
}
function promptBox(copy){const b=document.getElementById('promptbox');if(b){b.value=promptH();if(copy){b.focus();b.select();navigator.clipboard?.writeText(b.value).catch(()=>document.execCommand('copy'));}}}
function header(){
  document.getElementById('budget').textContent=money(db()-ds());
  document.getElementById('count').textContent=picks().length+' / 14';
  document.getElementById('slots').textContent=14-picks().length;
  document.getElementById('shown').textContent=available().length;
  document.getElementById('tabs').innerHTML=
    '<button class="tab '+(tab==='board'?'active':'')+'" data-tab="board">Draft Board</button>'+
    '<button class="tab '+(tab==='settings'?'active':'')+'" data-tab="settings">League Settings</button>'+
    '<button class="action undo" data-action="undo" '+(history.length?'':'disabled')+'>Undo Last</button>';
}
function draw(){header();document.getElementById('view').innerHTML=tab==='settings'?settingsH():boardH();}
// events
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;draw();}
  if(b.dataset.filter){filter=b.dataset.filter;viewMode='players';draw();}
  if(b.dataset.action==='take')act('take',b.dataset.name);
  if(b.dataset.action==='pick')act('pick',b.dataset.name);
  if(b.dataset.action==='remove')act('remove',b.dataset.name);
  if(b.dataset.action==='undo')undo();
  if(b.dataset.action==='viewBest'){viewMode='best';tab='board';draw();}
  if(b.dataset.action==='viewSleepers'){viewMode='sleepers';tab='board';draw();}
  if(b.dataset.action==='viewRoster'){viewMode='roster';tab='board';draw();}
  if(b.dataset.action==='addK'){snapshot();state.push({rank:9999,name:'New Keeper '+state.length,pos:'WR',team:'TBD',base:0,max:0,status:'Picked',salary:0,keeper:'Yes',notes:'',sleeper:false,pickOrder:Date.now()});save();draw();}
  if(b.dataset.action==='removeK'){snapshot();const p=getp(b.dataset.name);p.status='Available';p.keeper='No';p.salary=null;save();draw();}
  if(b.dataset.action==='importJ')importList(document.getElementById('json')?.value||'');
  if(b.dataset.action==='chooseJ'||b.dataset.action==='chooseFile')document.getElementById('file').click();
  if(b.dataset.action==='resetH'&&confirm('Reset draft?')){state=structuredClone(initial);history=[];save();draw();}
  if(b.dataset.action==='exportH'){promptBox(false);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([promptH()],{type:'text/plain'}));a.download='hubble-prompt.txt';a.click();}
  if(b.dataset.action==='copyH')promptBox(true);
});
document.addEventListener('change',e=>{
  if(e.target.dataset.salary){snapshot();const p=getp(e.target.dataset.salary);if(p){p.salary=e.target.value===''?0:Number(e.target.value);save();draw();}}
  if(e.target.dataset.setting){snapshot();settings[e.target.dataset.setting]=Number(e.target.value)||0;save();draw();}
  if(e.target.dataset.score){snapshot();settings.scoring[e.target.dataset.score]=e.target.value;save();draw();}
  if(e.target.dataset.kfield){snapshot();const p=getp(e.target.dataset.name),f=e.target.dataset.kfield;if(p)p[f]=f==='pos'?e.target.value.toUpperCase():e.target.value;save();draw();}
  if(e.target.id==='file'&&e.target.files[0]){const r=new FileReader();r.onload=()=>importList(r.result);r.readAsText(e.target.files[0]);}
});
document.addEventListener('click',e=>{const h=e.target.closest('[data-sort]');if(h){const s=h.dataset.sort;dir=sort===s?-dir:-1;sort=s;draw();}});
document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target===document.getElementById('settingsModal'))closeSettings();});
window.addEventListener('authChanged',()=>renderTopbar());
// init
renderTopbar();
draw();
checkAutoExport();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
